name: Deploy to VPS

on:
  push:
    branches:
      - master 
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Aktualisiert
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Aktualisiert
        with:
          node-version: '20'

      - name: Detect PocketBase migration changes
        id: migrations
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          rm -rf migrations-upload
          mkdir migrations-upload
          # Manueller Start oder erster Push: alle versionierten Migrationen hochladen
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            FILES=$(git ls-files 'pb_migrations/*.js')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'pb_migrations/*.js')
          fi
          for f in $FILES; do cp "$f" migrations-upload/; done
          if [ -n "$(ls -A migrations-upload)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/root/pb/pb_public"
          strip_components: 1

      - name: Deploy PocketBase migrations
        if: steps.migrations.outputs.changed == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "migrations-upload/*.js"
          target: "/root/pb/pb_migrations"
          strip_components: 1

      - name: Restart PocketBase after migration deployment
        if: steps.migrations.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo -n systemctl restart pocketbase.service
            sudo -n systemctl is-active --quiet pocketbase.service
