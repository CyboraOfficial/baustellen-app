name: Deploy to VPS

on:
  push:
    branches:
      - master 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Aktualisiert
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Aktualisiert
        with:
          node-version: '20'

      - name: Detect PocketBase migration changes
        id: migrations
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$SHA" -- pb_migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/root/pb/pb_public"
          strip_components: 1

      - name: Deploy PocketBase migrations
        if: steps.migrations.outputs.changed == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pb_migrations/*.js"
          target: "/root/pb/pb_migrations"
          strip_components: 1

      - name: Restart PocketBase after migration deployment
        if: steps.migrations.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo -n systemctl restart pocketbase.service
            sudo -n systemctl is-active --quiet pocketbase.service
