name: Version and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Increment patch version and push tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin '+refs/heads/master:refs/remotes/origin/master' --tags
            git checkout --detach origin/master
            base=$(git rev-parse HEAD)
            current=$(node -p "require('./package.json').version")
            if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must have the format major.minor.patch: $current"
              exit 1
            fi

            tag=$(npm version patch --no-git-tag-version)
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Set an unused version in package.json."
              exit 1
            fi

            node scripts/release-changelog.mjs "$tag"
            git add package.json package-lock.json APP_CHANGELOG.md
            git commit -m "chore: release $tag"
            git tag "$tag"
            if git push --atomic origin HEAD:refs/heads/master "refs/tags/$tag:refs/tags/$tag"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag -d "$tag"
            remote=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
            if [[ "$remote" == "$base" ]]; then
              echo "::error::Push failed without master changing. Check repository permissions and branch protection."
              exit 1
            fi
            echo "master changed during versioning; retrying ($attempt/5)."
          done

          echo "::error::Could not push the version after 5 attempts."
          exit 1

  release:
    needs: version
    uses: ./.github/workflows/build-electron.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  deploy:
    needs: version
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets: inherit
